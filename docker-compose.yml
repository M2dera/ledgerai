services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgerai
      POSTGRES_USER: ledgerai
      POSTGRES_PASSWORD: ledgerai_local_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ledgerai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerai -d ledgerai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledgerai-postgres:
